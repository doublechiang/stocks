name: Deploy to Cloud Run

on:
  push:
    branches: [main]

env:
  PROJECT_ID: stock-app-tw-061683
  REGION: asia-east1
  SERVICE: stock-app

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write  # Required for Workload Identity Federation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/213290980608/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@stock-app-tw-061683.iam.gserviceaccount.com

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          source: .
          region: ${{ env.REGION }}
          flags: --allow-unauthenticated --port=8080 --memory=1Gi --cpu=1 --session-affinity
